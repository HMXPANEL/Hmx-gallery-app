name: Android Release

on:
  # Manual only: release signing secrets must never be exposed to PR builds.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          platform-tools: true
          ndk: false
          cmake: false

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Configure Supabase credentials (.env)
        # Same mechanism as CI: real values only from repo secrets, never logged.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            echo "::error::SUPABASE_URL/SUPABASE_ANON_KEY secrets are not set; release requires Supabase configuration."
            exit 1
          fi

      - name: Verify Supabase configuration presence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -f .env ] || { echo "::error::.env was not created from secrets"; exit 1; }
          [ "$(grep -c '^SUPABASE_URL=' .env)" = "1" ] || { echo "::error::SUPABASE_URL missing from .env"; exit 1; }
          [ "$(grep -c '^SUPABASE_ANON_KEY=' .env)" = "1" ] || { echo "::error::SUPABASE_ANON_KEY missing from .env"; exit 1; }
          echo "Supabase configuration supplied via build environment (values masked by GitHub)."

      - name: Restore release keystore
        # Persistent signing identity from secrets (created once, reused forever).
        # Fails clearly if the one-time signing setup was never performed.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/hmx-release.jks
          [ -s /tmp/hmx-release.jks ] || { echo "::error::Decoded keystore is empty."; exit 1; }
          echo "Release keystore restored."

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: /tmp/hmx-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APK and signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::Release APK not found at $APK"; exit 1; }
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer #1|SHA-256|Verified using"
          echo "Release APK exists and carries a valid v1/v2 signature."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: hmx-gallery-release-r${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hmx-gallery-release-reports-r${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Clean temporary signing files
        if: always()
        run: rm -f /tmp/hmx-release.jks .env
