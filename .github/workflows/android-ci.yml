name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          platform-tools: true
          ndk: false
          cmake: false

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Provide CI debug keystore
        # app/build.gradle.kts signs `debug` with rootDir/debug.keystore,
        # which is gitignored. Generate a standard debug keystore when absent.
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Supabase credentials (.env)
        # Real values only if the repo owner sets these secrets.
        # Otherwise the build falls back to .env.example placeholder defaults,
        # which still compiles (SupabaseConfig has safe fallbacks). Values are
        # never echoed: GitHub masks secret values in logs automatically.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            echo "No Supabase secrets configured; building with .env.example placeholder defaults."
          fi

      - name: Verify Supabase configuration presence
        # Proves both keys reached the build environment without printing values
        # (only key counts are echoed). Fails the run if secrets exist but .env
        # was not created correctly.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            [ -f .env ] || { echo "::error::.env was not created from secrets"; exit 1; }
            [ "$(grep -c '^SUPABASE_URL=' .env)" = "1" ] || { echo "::error::SUPABASE_URL missing from .env"; exit 1; }
            [ "$(grep -c '^SUPABASE_ANON_KEY=' .env)" = "1" ] || { echo "::error::SUPABASE_ANON_KEY missing from .env"; exit 1; }
            echo "Supabase configuration supplied via build environment (values masked by GitHub)."
          else
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY secrets are not set; APK uses placeholder defaults and reports a configuration error at runtime."
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hmx-gallery-debug-r${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hmx-gallery-reports-r${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
